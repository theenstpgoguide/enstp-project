<style>
@layer theme,base,components,utilities;
:root{--font-sans:'Manrope',sans-serif;--font-display:'Manrope',sans-serif}
@layer base{*,::after,::before,::backdrop,::file-selector-button{box-sizing:border-box;margin:0;padding:0;border:0 solid}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4;font-family:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}a{color:inherit;text-decoration:inherit}b,strong{font-weight:bolder}small{font-size:80%}
img,svg,video,canvas,audio,iframe,embed,object{display:block;vertical-align:middle}img,video{max-width:100%;height:auto}
button,input,select,textarea,::file-selector-button{font:inherit;letter-spacing:inherit;color:inherit;border-radius:0;background-color:transparent;opacity:1}
:where(button,input:where([type=button],[type=reset],[type=submit])),::file-selector-button{appearance:button}::placeholder{opacity:1;color:color-mix(in oklab,currentcolor 50%,transparent)}}
@layer utilities{
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;white-space:nowrap;border-radius:6px;font-size:.875rem;line-height:calc(1.25/.875);font-weight:500;cursor:pointer;transition-property:color,background-color,border-color,outline-color,text-decoration-color,fill,stroke;transition-duration:.15s;transition-timing-function:cubic-bezier(.4,0,.2,1)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 1px var(--primary)}.btn:disabled{pointer-events:none;opacity:.5;cursor:not-allowed}.btn svg{pointer-events:none;width:1rem;height:1rem;flex-shrink:0}
.btn-md{height:2.25rem;padding:.5rem 1rem}.btn-icon{height:2.25rem;width:2.25rem}
.btn-hero{background:var(--primary-foreground);color:var(--primary);box-shadow:0 1px 3px 0 rgb(0 0 0/.1),0 1px 2px -1px rgb(0 0 0/.1)}
.btn-heroOutline{border:1px solid color-mix(in oklab,var(--primary-foreground) 40%,transparent);color:var(--primary-foreground);background:transparent}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-outline{border:1px solid var(--border);background:var(--background);box-shadow:0 1px 3px 0 rgb(0 0 0/.1),0 1px 2px -1px rgb(0 0 0/.1)}
@media(hover:hover){.btn-hero:hover{background:var(--secondary)}.btn-heroOutline:hover{background:color-mix(in oklab,var(--primary-foreground) 10%,transparent)}.btn-default:hover{background:color-mix(in oklab,var(--primary) 90%,transparent)}.btn-outline:hover,.btn-ghost:hover{background:var(--accent);color:var(--foreground)}}
.contents{display:contents}.inline{display:inline}.ml-2{margin-left:.5rem}.mr-1{margin-right:.25rem}.size-4{width:1rem;height:1rem}.mt-3{margin-top:.75rem}.h-64{height:16rem}.w-full{width:100%}.rounded-xl{border-radius:.75rem}.border{border:1px solid}.border-border{border-color:var(--border)}
.nf{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--background);padding-inline:1rem;color:var(--foreground)}.nf>div{max-width:28rem;text-align:center}
.nf h1{font-size:4.5rem;line-height:1;font-weight:700}.nf h2{margin-top:1rem;font-size:1.25rem;line-height:calc(1.75/1.25);font-weight:600}.nf p{margin-top:.5rem;font-size:.875rem;line-height:calc(1.25/.875);color:var(--muted-foreground)}
.nf a{display:inline-flex;align-items:center;justify-content:center;margin-top:1.5rem;border-radius:6px;background:var(--primary);color:var(--primary-foreground);padding:.5rem 1rem;font-size:.875rem;font-weight:500}}

.lang-switch { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); }
.lang-switch button { min-width: 2.1rem; height: 1.9rem; padding: 0 .55rem; border-radius: 999px; font-size: .72rem; font-weight: 700; letter-spacing: .04em; color: var(--muted-foreground); transition: background .2s, color .2s; }
.lang-switch button:hover { color: var(--foreground); }
.lang-switch button.lang-active { background: var(--primary); color: var(--primary-foreground); }
[dir="rtl"] body { font-family: "Noto Kufi Arabic", "Manrope", sans-serif; }
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }

.auth-page{min-height:60vh;display:flex;justify-content:center;padding:4rem 1.25rem}
.auth-card{width:100%;max-width:30rem;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:1.5rem;padding:2rem;box-shadow:0 20px 50px -25px rgba(0,0,0,.25)}
.auth-card h1{font-size:1.75rem;font-weight:800;margin-bottom:.5rem}
.auth-card>p{opacity:.7;margin-bottom:1.25rem}

.auth-tabs button{flex:1}
.auth-form{display:grid;gap:.9rem}
.auth-form label{display:grid;gap:.35rem;font-weight:600;font-size:.9rem}
.auth-form input{border:1px solid rgba(0,0,0,.15);border-radius:.75rem;padding:.7rem .9rem;font:inherit;font-weight:400}
.auth-ok{color:#047857}.auth-err{color:#b91c1c}
.auth-actions{display:flex;gap:.75rem;flex-wrap:wrap}
.account-link{font-weight:600;font-size:.9rem;padding:.45rem .8rem;border-radius:999px;border:1px solid rgba(0,0,0,.12)}

/* Keep the brand and fixed-size controls in independent, shrink-safe tracks. */
.site-header{height:auto}
.header-inner{min-height:86px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;padding:0 32px}
.brand,.brand-name,.desktop-nav{min-width:0}
.brand{white-space:nowrap}
.brand-symbol,.header-actions,.header-tools,.lang-switch,.account-link{flex-shrink:0}

.desktop-nav svg,.mobile-nav svg{flex-shrink:0}

.account-link{border-color:var(--border);font-size:12px}

.cantine{
    --background: oklch(0.95 0.03 75);
    --foreground: oklch(0.28 0.06 150);
    --card: oklch(0.985 0.015 80);
    --primary: oklch(0.48 0.12 150);
    --primary-fg: oklch(0.98 0.01 85);
    --secondary: oklch(0.88 0.05 70);
    --secondary-fg: oklch(0.32 0.05 60);
    --muted: oklch(0.92 0.04 75);
    --muted-fg: oklch(0.45 0.05 60);
    --accent: oklch(0.72 0.08 65);
    --accent-fg: oklch(0.2 0.03 60);
    --border: oklch(0.85 0.04 70);
  }
.cantine *{ box-sizing: border-box; }
.cantine{ margin: 0; background: var(--background); color: var(--foreground); font-family: "Manrope", system-ui, sans-serif; }
.cantine .ctitle,.cantine h2,.cantine h3{ font-family: "Fraunces", Georgia, serif; letter-spacing: -0.01em; margin: 0; }
.cantine button{ font-family: inherit; cursor: pointer; }
.cantine button:focus-visible,.cantine a:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
.cantine .wrap{ max-width: 768px; margin: 0 auto; padding: 32px 20px 64px; }
.cantine .back{ display: inline-flex; align-items: center; gap: 6px; color: var(--muted-fg); font-size: .875rem; font-weight: 600; text-decoration: none; }
.cantine .back:hover{ color: var(--foreground); }
.cantine .ctitle{ font-size: 2.25rem; margin-top: 20px; }
.cantine .sub{ color: var(--muted-fg); margin: 8px 0 0; }
.cantine .status{ margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: .875rem; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.cantine .dot{ position: relative; width: 10px; height: 10px; border-radius: 50%; background: color-mix(in oklab, var(--muted-fg) 50%, transparent); }
.cantine .dot.on{ background: var(--primary); }
.cantine .dot.on::after{ content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--primary); animation: cping 1.6s cubic-bezier(0,0,.2,1) infinite; }
@keyframes cping{ 75%, 100% { transform: scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce){.cantine .dot.on::after{ animation: none; }
.cantine *{ scroll-behavior: auto !important; }
 }
.cantine .info{ display: grid; gap: 12px; margin-top: 20px; grid-template-columns: 1fr 1fr; }
.cantine .info .tile{ display: flex; align-items: center; gap: 12px; background: var(--secondary); border-radius: 12px; padding: 12px; }
.cantine .info .ic{ width: 36px; height: 36px; border-radius: 8px; background: var(--card); color: var(--primary); display: grid; place-items: center; flex-shrink: 0; }
.cantine .info small{ display: block; font-size: .75rem; color: color-mix(in oklab, var(--secondary-fg) 70%, transparent); }
.cantine .info b{ color: var(--secondary-fg); font-weight: 600; }
.cantine .tabs{ display: flex; gap: 8px; margin-top: 32px; overflow-x: auto; padding: 8px 4px 8px; }
.cantine .tab{ flex: 1; min-width: 56px; display: flex; flex-direction: column; align-items: center; border: 0; border-radius: 12px; padding: 10px 12px; font-size: .875rem; font-weight: 600; background: var(--secondary); color: var(--secondary-fg); transition: all .3s; }
.cantine .tab:hover{ background: var(--muted); }
.cantine .tab small{ font-size: .75rem; font-weight: 500; opacity: .65; min-height: 1em; }
.cantine .tab.sel{ background: var(--primary); color: var(--primary-fg); transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0,0,0,.2); }
.cantine .tab i{ margin-top: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.cantine .tab.sel i{ background: var(--accent); }
.cantine .stage{ position: relative; margin-top: 24px; }
.cantine .viewport{ overflow: hidden; scroll-snap-type: x mandatory; display: flex; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
.cantine .viewport::-webkit-scrollbar{ display: none; }
.cantine .slide{ flex: 0 0 100%; min-width: 0; padding: 0 4px; scroll-snap-align: center; }
.cantine .card{ background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: opacity .5s; opacity: .4; }
.cantine .slide.sel .card{ opacity: 1; }
.cantine .head{ display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cantine h2{ font-size: 1.875rem; }
.cantine .date{ margin: 4px 0 0; min-height: 1.25rem; font-size: .875rem; color: var(--muted-fg); }
.cantine .today-badge{ background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 4px 12px; font-size: .75rem; font-weight: 700; }
.cantine .meals{ margin-top: 20px; display: grid; gap: 16px; }
.cantine .meal{ display: flex; gap: 16px; background: var(--muted); border-radius: 12px; padding: 16px; transition: all .3s; }
.cantine .meal.now{ box-shadow: 0 0 0 2px var(--primary); }
.cantine .meal.done{ opacity: .6; }
.cantine .icon{ width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; flex-shrink: 0; }
.cantine .body{ flex: 1; min-width: 0; }
.cantine .row{ display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.cantine .title{ display: flex; align-items: center; gap: 8px; }
.cantine h3{ font-size: 1rem; font-weight: 700; }
.cantine .time{ font-size: .75rem; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.cantine .info2{ margin-top: 4px; font-size: .75rem; color: var(--muted-fg); }
.cantine .chips{ margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.cantine .chips span{ font-size: 1rem; background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: .875rem; }
.cantine .tag{ border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
.cantine .tag.now{ background: var(--primary); color: var(--primary-fg); }
.cantine .tag.next{ background: var(--accent); color: var(--accent-fg); }
.cantine .tag.done{ font-weight: 600; color: var(--muted-fg); padding: 0; }
.cantine .nav{ position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 4px 6px rgba(0,0,0,.12); display: none; place-items: center; color: var(--foreground); }
.cantine .nav:hover{ background: var(--muted); }
.cantine .nav:disabled{ opacity: .3; cursor: default; }
.cantine .nav.l{ left: -16px; }
.cantine .nav.r{ right: -16px; }
@media (min-width: 640px){.cantine .nav{ display: grid; }
 }
@media (max-width: 560px){.cantine .info{ grid-template-columns: 1fr; }
.cantine .ctitle{ font-size: 1.9rem; }
.cantine .card{ padding: 18px; }
 }
.cantine .reset{ display: none; margin: 24px auto 0; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; font-size: .875rem; font-weight: 600; color: var(--foreground); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.cantine .reset:hover{ background: var(--muted); }
.cantine .reset.show{ display: block; }
.cantine svg{ width: 1em; height: 1em; display: block; }
.cantine .ic svg,.cantine .icon svg{ width: 20px; height: 20px; }
.cantine .info .ic svg{ width: 16px; height: 16px; }
.cantine .back svg{ width: 16px; height: 16px; }
.cantine .top{ display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cantine .lang{ display: inline-flex; background: var(--secondary); border-radius: 999px; padding: 3px; }
.cantine .lang button{ border: 0; background: transparent; color: var(--secondary-fg); font-weight: 700; font-size: .8rem; padding: 6px 12px; border-radius: 999px; transition: all .2s; }
.cantine .lang button.on{ background: var(--primary); color: var(--primary-fg); }
.cantine .viewport,.cantine .tabs{ direction: ltr; }
.cantine.ar .wrap,.cantine.ar .card{ direction: rtl; }
.cantine.ar{ font-family: "Cairo", "Manrope", system-ui, sans-serif; }
.cantine.ar .ctitle,.cantine.ar h2,.cantine.ar h3{ font-family: "Cairo", "Fraunces", serif; }
.cantine.ar .back svg{ transform: scaleX(-1); }
.cantine [lang="ar"]{ font-family: "Cairo", "Manrope", system-ui, sans-serif; }
.cantine .tab small{ direction: ltr; }


.cantine{margin-top:32px;border-radius:16px;font-size:16px;line-height:normal;overflow:hidden}.cantine h2{font-weight:700}.cantine .wrap{padding-bottom:36px}

</style>

  { slug: 'campus', title: 'Se repérer sur le campus', short: 'Le campus', description: 'Les bons repères pour trouver votre chemin à l’ENSTP.', icon: 'map', tone: 'mint', group: 'Campus', sections: [{title: 'Votre point de départ', text: 'L’ENSTP Francis Jeanson se situe rue Sidi Garidi, à Kouba, Alger. Retrouvez la localisation de l’école sur Google Maps avant votre première visite.'}, {title: 'À votre arrivée', text: 'À l’entrée, demandez où se trouvent la scolarité et le département des classes préparatoires. Ils pourront vous orienter vers votre groupe et vos salles.'}, {title: 'Les repères à identifier', text: 'Entrée principale, scolarité, amphithéâtres, bibliothèque, laboratoires et espaces de restauration : notez leurs emplacements lors de votre première visite.'}, {title: 'Plan intérieur', text: 'Le plan des bâtiments et les itinéraires salle par salle restent à relever et à valider sur place. Aucun trajet intérieur non vérifié n’est publié.'}], searches: [{label: 'Localiser l’ENSTP', query: 'ENSTP Francis Jeanson Kouba Alger'}] },
